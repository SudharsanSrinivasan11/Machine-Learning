<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emotion-Aware Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="chat" aria-label="Chatbot">
    <header class="chat-header">
      <div class="avatar" aria-hidden="true">🤖</div>
      <div>
        <h1>Emotion-Aware ChatBot</h1>
        <p><span class="dot"></span> Tell me how you feel</p>
      </div>
      <button id="clear" class="ghost" type="button" title="Clear conversation">Clear</button>
    </header>

    <section id="messages" class="messages" aria-live="polite"></section>

    <div id="suggestions" class="suggestions">
      <button type="button">I'm so excited, I got the internship!</button>
      <button type="button">I feel lonely lately</button>
      <button type="button">I'm nervous about my exam</button>
    </div>

    <form id="composer" class="composer" autocomplete="off">
      <input id="text" name="msg" type="text" maxlength="1000"
             placeholder="Type your message…" aria-label="Message" required>
      <button id="send" type="submit" aria-label="Send">➤</button>
    </form>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
